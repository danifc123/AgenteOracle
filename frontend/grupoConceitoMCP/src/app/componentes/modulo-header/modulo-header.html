<header class="page-header" [class.page-header--sem-descricao]="!descricao()">
  <div>
    <a class="voltar" routerLink="/" aria-label="Voltar para o início" title="Voltar para o início">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 6 9 12l6 6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </a>
    <p class="breadcrumb">{{ breadcrumb() }}</p>
    <h1>{{ titulo() }}</h1>
  </div>
  <ng-content select="[acoes]"></ng-content>
</header>

@if (descricao()) {
  <p class="instrucao">{{ descricao() }}</p>
}

[project]
name = "agente-oracle"
version = "0.1.0"
description = "Servidor MCP para integração com Oracle - emissão de relatórios e automações internas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.6.0",
    "oracledb>=2.4.0",
    "ollama>=0.4.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "openpyxl>=3.1.0",
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.2.0",
    "bcrypt>=4.2.0",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.0",
]

[project.scripts]
agente-oracle = "agente_oracle.server.app:main"
agente-oracle-chat = "agente_oracle.agent.cli:main"
agente-oracle-criar-usuario = "agente_oracle.tools.auth.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: exige Postgres local rodando (DB_BACKEND=postgres)",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "frontend"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
# Strings/f-strings longas (prompts, SQL, mensagens de erro) já são convenção
# neste projeto — não vale quebrar linha nelas artificialmente.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.ruff.format]
docstring-code-format = false

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads do Juntar Excel / anexos — default do Nginx (1m) é baixo
    # demais pra planilha real.
    client_max_body_size 25m;

    # Proxy pro backend, mesma origem do ponto de vista do navegador — é
    # isso que torna MCP_API_BASE_URL='' (ver app-config.ts) seguro em
    # produção, e elimina CORS por completo (CORSMiddleware do backend vira
    # só uma rede de segurança pra acesso direto fora do proxy).
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sem buffering e HTTP/1.1 — necessário pra respostas em streaming
        # (NDJSON de previsao.py hoje; qualquer stream futuro, ex: painel
        # de log). Com buffering ligado, o Nginx junta tudo antes de
        # mandar pro navegador e a resposta "incremental" vira uma única
        # entrega no final — nenhum erro visível, só perde o propósito do
        # streaming.
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Angular é SPA com roteamento no cliente — sem isso, atualizar a
    # página (F5) numa rota tipo /financeiro/vendas devolve 404 do Nginx
    # em vez de deixar o Angular Router assumir.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

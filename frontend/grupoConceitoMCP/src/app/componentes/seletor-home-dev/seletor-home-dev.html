<div class="seletor-home-wrapper" *appSoDev>
  <select
    class="seletor-home"
    [value]="homeSelecionada.modulo()"
    (change)="selecionar($event)"
    aria-label="Trocar tela de início"
    title="Trocar tela de início"
  >
    @for (modulo of sessao.modulos(); track modulo) {
      <option [value]="modulo">{{ rotuloModulo(modulo) }}</option>
    }
  </select>
  <svg class="chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
    <path d="m6 9 6 6 6-6" stroke-linecap="round" stroke-linejoin="round" />
  </svg>
</div>

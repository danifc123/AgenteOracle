<button
  type="button"
  class="gatilho"
  (click)="toggle()"
  [attr.aria-expanded]="aberto()"
  aria-label="Mais opções"
  title="Mais opções"
>
  <svg
    viewBox="0 0 24 24"
    width="18"
    height="18"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <circle cx="12" cy="5" r="1" />
    <circle cx="12" cy="12" r="1" />
    <circle cx="12" cy="19" r="1" />
  </svg>
</button>

@if (aberto()) {
  <!-- Clique em qualquer lugar do painel fecha o menu (inclusive ao clicar
       numa opção projetada via ng-content) — as opções em si são os elementos
       interativos reais e já são focáveis/acessíveis por conta própria. -->
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
  <div class="painel" (click)="fechar()">
    <ng-content></ng-content>
  </div>
}

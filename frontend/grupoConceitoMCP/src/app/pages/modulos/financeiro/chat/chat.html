<app-modulo-header breadcrumb="Assistente IA" titulo="Converse com o Agente Oracle" />

<section class="chat-card">
  <app-chat-mensagens
    [mensagens]="servico.mensagens()"
    [enviando]="servico.enviando()"
    [baixandoSql]="servico.baixandoSql()"
    (baixarRelatorio)="baixarRelatorio($event)"
  />

  <app-chat-entrada
    [entrada]="entrada()"
    [enviando]="servico.enviando()"
    (entradaChange)="entrada.set($event)"
    (enviar)="enviar()"
  />
</section>

    .pasta { font-family: 'IBM Plex Mono', 'JetBrains Mono', ui-monospace, monospace; font-weight: 600; font-size: 13px; }
    .arquivo { font-family: 'IBM Plex Mono', 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: #16202e; }
    .comentario { font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif; font-size: 12.5px; fill: #5b6b82; }
    .guia { stroke: #c3cedd; stroke-width: 1.2; }
    ]]>
  </style>
  <defs>
